name: Navigator Public HTTPS Probe

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional HTTPS target override for the dedicated real public probe. Must be in the approved workflow allowlist.
        required: false
        default: https://sha256.badssl.com/

jobs:
  navigator-public-https-probe:
    name: Manual Secret-Gated Public HTTPS Probe
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GXOS_NAVIGATOR_SMOKE_ENABLE_REAL_PUBLIC_HTTPS: "1"
      GXOS_NAVIGATOR_SMOKE_REQUIRE_REAL_PUBLIC_HTTPS: "1"
      GXOS_NAVIGATOR_SMOKE_REAL_PUBLIC_HTTPS_URL: ${{ inputs.target_url }}
      GXOS_NAVIGATOR_SMOKE_REAL_PUBLIC_HTTPS_TARGET: ${{ inputs.target_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate approved public HTTPS target
        shell: powershell
        run: |
          $requestedTarget = "${{ inputs.target_url }}".Trim()
          $approvedTargets = @(
            "https://sha256.badssl.com/"
          )

          $isApproved = $false
          foreach ($approvedTarget in $approvedTargets) {
            if ([string]::Equals($approvedTarget, $requestedTarget, [System.StringComparison]::OrdinalIgnoreCase)) {
              $isApproved = $true
              break
            }
          }

          if (-not $isApproved) {
            throw "Requested target_url '$requestedTarget' is not in the approved manual workflow allowlist. Approved targets: $($approvedTargets -join ', ')"
          }

      - name: Install MinGW toolchain
        shell: powershell
        run: |
          choco install mingw --no-progress -y

          $gppCommand = Get-Command g++.exe -ErrorAction SilentlyContinue
          $gppPath = if ($null -ne $gppCommand) { $gppCommand.Source } else { $null }
          if ([string]::IsNullOrWhiteSpace($gppPath)) {
            foreach ($candidate in @(
              "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\g++.exe",
              "C:\tools\mingw64\bin\g++.exe",
              "C:\mingw64\bin\g++.exe"
            )) {
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $gppPath = $candidate
                break
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($gppPath)) {
            throw "Unable to locate g++.exe after installing MinGW."
          }

          $mingwBin = Split-Path -Parent $gppPath
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install QEMU
        shell: powershell
        run: |
          choco install qemu --no-progress -y

          $qemuCommand = Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue
          $qemuPath = if ($null -ne $qemuCommand) { $qemuCommand.Source } else { $null }
          if ([string]::IsNullOrWhiteSpace($qemuPath)) {
            $qemuCandidate = Join-Path ${env:ProgramFiles} "qemu\qemu-system-x86_64.exe"
            if (Test-Path -LiteralPath $qemuCandidate -PathType Leaf) {
              $qemuPath = $qemuCandidate
            }
          }
          if ([string]::IsNullOrWhiteSpace($qemuPath)) {
            throw "Unable to locate qemu-system-x86_64.exe after installing QEMU."
          }

          $qemuBin = Split-Path -Parent $qemuPath
          $qemuBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Materialize public CA bundle secret
        shell: powershell
        env:
          GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_PEM: ${{ secrets.GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_PEM)) {
            throw "Repository secret GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_PEM is required for this manual workflow."
          }

          $bundlePath = Join-Path $env:RUNNER_TEMP "guidexos-navigator-public-ca-bundle.pem"
          [System.IO.File]::WriteAllText($bundlePath, $env:GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_PEM, [System.Text.Encoding]::ASCII)

          if (-not (Test-Path -LiteralPath $bundlePath -PathType Leaf)) {
            throw "Failed to materialize the public CA bundle secret."
          }

          "GXOS_NAVIGATOR_SMOKE_REAL_PUBLIC_HTTPS_CA_BUNDLE_SOURCE=$bundlePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_TEMP_PATH=$bundlePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run dedicated public HTTPS probe
        id: public_probe
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-navigator-public-https.ps1 -Build

      - name: Surface PASS assertion report
        if: always()
        shell: powershell
        run: |
          $summary = Get-ChildItem -LiteralPath .\logs -Filter "navigator-public-https-*.summary.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $summary) {
            Write-Output "No navigator public HTTPS summary log was produced, so no PASS assertion could run."
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## PASS Assertion"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "No navigator public HTTPS summary log was produced, so no PASS assertion could run."
            exit 0
          }

          if ("${{ steps.public_probe.outcome }}" -ne "success") {
            Write-Output "Dedicated public HTTPS probe did not exit 0; PASS assertion replay skipped."
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## PASS Assertion"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Dedicated public HTTPS probe did not exit 0; PASS assertion replay skipped."
            exit 0
          }

          $assertOutput = @(& powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-navigator-public-https-pass.ps1 -SummaryPath $summary.FullName 2>&1)
          $assertExitCode = $LASTEXITCODE
          foreach ($line in $assertOutput) {
            Write-Output "$line"
          }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## PASS Assertion"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "```text"
          foreach ($line in $assertOutput) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "$line"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "```"

          if ($assertExitCode -ne 0) {
            throw "Navigator public HTTPS PASS assertion replay failed for $($summary.FullName)."
          }

      - name: Summarize dedicated probe result
        if: always()
        shell: powershell
        run: |
          $summary = Get-ChildItem -LiteralPath .\logs -Filter "navigator-public-https-*.summary.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $evidence = Get-ChildItem -LiteralPath .\logs -Filter "navigator-public-https-*.evidence.json" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $summary) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "No navigator public HTTPS summary log was produced."
            exit 0
          }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Navigator Public HTTPS Probe"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "```text"
          Get-Content -LiteralPath $summary.FullName | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "```"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## PASS Review Contract"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Treat the run as proof only when result_marker=PASS and final_result=PASS."
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Confirm public_trust_ready=yes, public_ca_parsed_certs > 0, dns_result=PASS, tcp_result=PASS, tls_result=PASS, certificate_validation_result=PASS, hostname_validation_result=PASS, verify_flags=0, and plaintext_fallback=no."
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Confirm sni_host matches the target hostname and http_status shows a real HTTPS response."
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- SETUP_BLOCKED, SKIP, and FAIL are not proof of working public HTTPS."

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Structured Evidence"
          if ($null -eq $evidence) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "No navigator public HTTPS evidence JSON artifact was produced."
          } else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Evidence JSON path: $($evidence.FullName)"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "```json"
            Get-Content -LiteralPath $evidence.FullName | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "```"
          }

      - name: Upload dedicated probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigator-public-https-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            logs/navigator-public-https-*.summary.log
            logs/navigator-public-https-*.serial.log
            logs/navigator-public-https-*.evidence.json

      - name: Remove temporary CA bundle
        if: always()
        shell: powershell
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_TEMP_PATH) -and
              (Test-Path -LiteralPath $env:GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_TEMP_PATH -PathType Leaf)) {
            Remove-Item -LiteralPath $env:GXOS_NAVIGATOR_PUBLIC_CA_BUNDLE_TEMP_PATH -Force -ErrorAction Stop
          }
