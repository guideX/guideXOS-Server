<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Navigator JavaScript JS79 invalid receiver</title></head>
<body>
<pre id="result">JS79:invalid:pending</pre>
<i class="row"></i>
<script>
var cursor = document.querySelectorAll('.row').values();
var next = cursor.next;
document.getElementById('result').textContent = 'JS79:invalid:calling';
next();
document.getElementById('result').textContent = 'JS79:invalid:returned';
</script>
</body>
</html>
