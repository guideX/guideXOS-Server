<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Navigator JavaScript JS81 invalid receiver</title></head>
<body>
<pre id="result">JS81:invalid:pending</pre>
<i class="row"></i>
<script>
var rows = document.querySelectorAll('.row');
var entries = rows.entries;
document.getElementById('result').textContent = 'JS81:invalid:calling';
entries();
document.getElementById('result').textContent = 'JS81:invalid:returned';
</script>
</body>
</html>
