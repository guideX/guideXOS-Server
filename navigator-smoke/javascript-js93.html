[1, 2, 3].forEach(function(value) {

var thisContext = { marker: 7 };
var thisArgOk = false;
[5].forEach(function(value, index, array) {

[1].forEach(function() { omittedThisOk = this === undefined; });

}, undefined);
verify(thisArgOk && omittedThisOk && explicitUndefinedThisOk);

var nestedTrace = "";

nestedOuter.forEach(function(value, index, array) {
  nestedTrace = nestedTrace + "o" + index;
  if (index === 0) {
    array.forEach(function(innerValue, innerIndex) {
      nestedTrace = nestedTrace + "i" + innerIndex;
    });
    nestedOther.forEach(function(otherValue, otherIndex) {

    });
  }
  nestedTrace = nestedTrace + "r" + index;

verify(nestedTrace === "o0i0i1d0d1r0o1r1");

rows.forEach(function(row, index, collection) {

var rowIdentity;
[retainedRow].forEach(function(value) { rowIdentity = value; });
verify(domCalls === 2 && arrayFromDom === 3 && domFromArray === 4 &&

var iterator = [4, , 6].keys();

verify(iteratorKeys && ![4, , 6].hasOwnProperty("1"));

  var outerIndices = "";
  outerValues.forEach(function(value, index) {
    outerIndices = outerIndices + index;
    if (index === 0) eventB.click();

    outerIndices === "01" && nestedEventOk;
  document.getElementById("result").textContent =

  ":basic=" + (sum === 60 && returnValue === undefined) +
  ":sparse=" + (sparseCount === 3 && sparseIndices === "023") +
  ":length=" + (appendCount === 2) +
