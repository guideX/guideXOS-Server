<!doctype html>
<html>
<head><title>Navigator JavaScript JS54</title></head>
<body>
<h1>Navigator JavaScript JS54</h1>
<div id="panel" class="group" data-zone="primary">
  <span id="span-before" class="marker" data-role="before">Before</span>
  <BUTTON id="button-first" class="item target" data-role="primary">First button</BUTTON>
  <i id="icon" class="icon">Icon</i>
  <button id="button-last" class="item" data-role="secondary">Last button</button>
  <span id="span-last">Last span</span>
</div>
<div id="single-parent"><button id="only-button" class="item" data-role="solo">Only button</button></div>
<div id="three-parent">
  <button id="three-first"></button>
  <span id="three-gap"></span>
  <button id="three-middle"></button>
  <button id="three-last"></button>
</div>
<div id="mixed-parent">
  <span id="mixed-before"></span>
  <button id="only-type-button"></button>
  <input id="mixed-after" type="text">
</div>
<div id="hidden-parent">
  <button id="hidden-button" style="display:none">Hidden</button>
  <span id="hidden-gap"></span>
  <button id="visible-button">Visible</button>
</div>
<div id="class-parent">
  <button id="class-target" class="target" data-role="primary"></button>
  <button id="class-peer" class="peer" data-role="secondary"></button>
</div>
<div id="attribute-parent">
  <button id="attribute-target" data-role="target"></button>
  <button id="attribute-peer" data-role="peer"></button>
</div>
<div id="outside-parent">
  <input id="form-owned" form="form-owner" type="text">
</div>
<form id="form-owner"></form>
<p id="js54-state">initial</p>
<script>
var js54State = document.getElementById("js54-state");
var panel = document.getElementById("panel");
var firstButton = document.getElementById("button-first");
var lastButton = document.getElementById("button-last");
var onlyButton = document.getElementById("only-button");
var onlyTypeButton = document.getElementById("only-type-button");
var firstEvent = false;
var lastEvent = false;
var nestedEvent = false;
var eventMetadata = false;
var mixed = firstButton.matches(":first-of-type") &&
  !firstButton.matches(":first-child") &&
  lastButton.matches(":last-of-type") &&
  !lastButton.matches(":last-child") &&
  onlyTypeButton.matches(":only-of-type") &&
  !onlyTypeButton.matches(":only-child");
var soleChild = onlyButton.matches(":first-child") &&
  onlyButton.matches(":last-child") && onlyButton.matches(":only-child") &&
  onlyButton.matches(":first-of-type") &&
  onlyButton.matches(":last-of-type") &&
  onlyButton.matches(":only-of-type");
var parser = firstButton.matches(":FIRST-OF-TYPE") &&
  firstButton.matches(":First-Of-Type") &&
  firstButton.matches("*:first-of-type") &&
  firstButton.matches("BUTTON:first-of-type") &&
  firstButton.matches("#button-first:first-of-type") &&
  firstButton.matches(".target:first-of-type") &&
  firstButton.matches("[data-role=primary]:first-of-type") &&
  firstButton.matches("button#button-first.item.target[data-role=primary]:first-of-type") &&
  document.querySelector(":firstoftype") === null &&
  document.querySelector(":first--of-type") === null &&
  document.querySelector(":first-of-type-extra") === null &&
  document.querySelector(":first-of-type()") === null &&
  document.querySelector("button:first-of-type:last-of-type") === null;
var typeFilters = !document.getElementById("class-target").matches(".target:only-of-type") &&
  !document.getElementById("attribute-target").matches("[data-role=target]:only-of-type");
var hiddenStructural = !document.getElementById("visible-button").matches(":first-of-type") &&
  !document.getElementById("hidden-button").matches(":last-of-type");
var rootSafe = document.querySelector("html").parentElement === null &&
  !document.querySelector("html").matches(":first-of-type") &&
  !document.querySelector("html").matches(":last-of-type") &&
  !document.querySelector("html").matches(":only-of-type");
var formIndependent = document.getElementById("form-owned").matches(":only-of-type") &&
  document.getElementById("form-owned").parentElement ===
    document.getElementById("outside-parent");
var traversal = panel.children.length === 5 &&
  panel.firstElementChild === document.getElementById("span-before") &&
  panel.lastElementChild === document.getElementById("span-last") &&
  panel.querySelector(":first-of-type") === document.getElementById("span-before") &&
  panel.querySelectorAll("button:last-of-type").length === 1 &&
  panel.querySelectorAll("button:last-of-type")[0] === lastButton;
var relations = document.querySelector(".group:first-of-type button:last-of-type") === lastButton &&
  document.querySelector("#panel:first-of-type > button:last-of-type") === lastButton &&
  document.querySelector("#icon:first-of-type + button:last-of-type") === lastButton &&
  document.querySelector("#span-before:first-of-type ~ button:last-of-type") === lastButton &&
  lastButton.closest(".group:first-of-type") === panel;
var lists = document.querySelectorAll("#only-button:first-child, #only-button:only-of-type").length === 1 &&
  document.querySelectorAll("button:first-of-type, button:last-of-type")[0] === firstButton &&
  document.querySelectorAll("button:first-of-type, button:last-of-type")[1] === lastButton &&
  document.querySelectorAll("#button-last:last-of-type, #button-first:first-of-type")[0] === firstButton &&
  document.querySelector("#button-last:last-of-type, #button-first:first-of-type") === firstButton;
firstButton.addEventListener("click", function (event) {
  var target = event.target;
  var current = event.currentTarget;
  var phase = event.eventPhase;
  firstEvent = target.matches(":first-of-type") &&
    !target.matches(":first-child") &&
    target.closest(".group:first-of-type") === panel;
  lastButton.click();
  nestedEvent = event.target === target && event.currentTarget === current &&
    event.eventPhase === phase;
  eventMetadata = event.relatedTarget === null &&
    event.defaultPrevented === false && current === firstButton && phase === 2;
  js54Snapshot("event");
});
lastButton.addEventListener("click", function (event) {
  lastEvent = event.target.matches(":last-of-type") &&
    !event.target.matches(":last-child");
  js54Snapshot("event");
});
function js54Snapshot(label) {
  js54State.textContent = label + ":mixed=" + mixed + ":soleChild=" + soleChild +
    ":parser=" + parser + ":filters=" + typeFilters + ":hidden=" + hiddenStructural +
    ":root=" + rootSafe + ":form=" + formIndependent + ":traversal=" + traversal +
    ":relations=" + relations + ":lists=" + lists + ":event=" + firstEvent +
    ":lastEvent=" + lastEvent + ":nested=" + nestedEvent + ":metadata=" + eventMetadata;
}
js54Snapshot("initial");
</script>
</body>
</html>
