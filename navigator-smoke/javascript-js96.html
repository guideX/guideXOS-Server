<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Navigator JavaScript JS96</title></head>
<body>
<h1>Navigator JavaScript JS96</h1>
<pre id="result">JS96:pending</pre>
<button id="some-event-a" type="button">Run JS96 some event</button>
<button id="some-event-b" type="button">Nested JS96 some event</button>
<script>
var assertions = 0;
var failures = 0;
function verify(condition) {
  assertions=assertions+1;
  if (!condition) failures=failures+1;
}

var source = [1, 3, 6, 9];
var calls = 0;
var indices = "";
var callbackArgs = true;
var found = source.some(function(value, index, array) {
  calls=calls+1;
  indices = indices + index;
  callbackArgs = callbackArgs && array === source && value === source[index];
  return value === 6;
});
verify(found === true && calls === 3 && indices === "012" && callbackArgs);
verify(source[3] === 9 && found !== 6);

var empty = [];
var emptyCalls = 0;
var emptyResult = empty.some(function() { emptyCalls=emptyCalls+1; return true; });
verify(emptyResult === false && emptyCalls === 0);

var context = {target: 7};
var thisArgOk = false;
var one = [7].some(function(value, index, array) {
  thisArgOk = this === context && value === 7 && index === 0 && array.length === 1;
  return this.target;
}, context);
verify(one === true && thisArgOk);

var truthyValues = [0, 2, "yes", null, undefined, {}, []];
var truthyCalls = 0;
var truthyResult = truthyValues.some(function(value) {
  truthyCalls=truthyCalls+1;
  return value;
});
verify(truthyResult === true && truthyCalls === 2);

var sparse = [];
sparse.length = 5;
sparse[1] = undefined;
sparse[4] = 9;
var sparseCalls = 0;
var sparseIndices = "";
var undefinedVisited = false;
var sparseResult = sparse.some(function(value, index, array) {
  sparseCalls=sparseCalls+1;
  sparseIndices = sparseIndices + index;
  if (index === 1) undefinedVisited = value === undefined && array === sparse;
  return value === 9;
});
verify(sparseResult === true && sparseCalls === 2 && sparseIndices === "14");
verify(undefinedVisited && !sparse.hasOwnProperty("0"));

var replaced = [1, 2, 3];
var replaceResult = replaced.some(function(value, index, array) {
  if (index === 0) array[1] = 9;
  return value === 9;
});
verify(replaceResult === true && replaced[1] === 9);

var filled = [1, , 3];
var fillResult = filled.some(function(value, index, array) {
  if (index === 0) array[1] = 2;
  return value === 2;
});
verify(fillResult === true);

var appended = [4, 5];
var appendCalls = 0;
var appendResult = appended.some(function(value, index, array) {
  appendCalls=appendCalls+1;
  if (index === 0) array[2] = 6;
  return value === 6;
});
verify(appendResult === false && appendCalls === 2 && appended[2] === 6);

var current = [5];
var currentValue = 0;
current.some(function(value, index, array) {
  array[0] = 99;
  currentValue = value;
  return false;
});
verify(currentValue === 5 && current[0] === 99);

var inner = [1, 2, 3];
var nestedCalls = 0;
var nestedResult = [inner].some(function(values) {
  var selected = values.filter(function(value) { return value > 1; });
  var mapped = values.map(function(value) { return value * 2; });
  mapped.forEach(function() { nestedCalls=nestedCalls+1; });
  return selected.length === 2 && mapped.length === 3 && nestedCalls === 3;
});
verify(nestedResult === true && nestedCalls === 3);

var skippedCalls = 0;
var shortCircuit = [1, 2, 3].some(function(value) {
  skippedCalls=skippedCalls+1;
  if (value === 3) null.missing;
  return value === 1;
});
verify(shortCircuit === true && skippedCalls === 1);

var finalMatch = [1, 3, 9].some(function(value) { return value === 9; });
verify(finalMatch === true);

var marker = "JS96:assertions=" + assertions + ":failures=" + failures +
  ":shortCircuit=" + shortCircuit + ":sparse=" + sparseResult +
  ":nested=" + nestedResult + ":events=ready";
document.getElementById("result").textContent = marker;

var eventA = document.getElementById("some-event-a");
var eventB = document.getElementById("some-event-b");
var nestedEventOk = false;
var outerEventOk = false;
eventB.addEventListener("click", function(event) {
  var matched = [1, 2, 3].some(function(value) { return value === 2; });
  nestedEventOk = event.target === eventB && event.currentTarget === eventB && matched;
});
eventA.addEventListener("click", function(event) {
  var values = [4, 5, 6];
  var matched = values.some(function(value, index) {
    if (index === 0) eventB.click();
    return value > 4;
  });
  outerEventOk = event.target === eventA && event.currentTarget === eventA &&
    matched && nestedEventOk;
  document.getElementById("result").textContent =
    "JS96:event:nested=" + nestedEventOk + ":outer=" + outerEventOk;
});
</script>
</body>
</html>
