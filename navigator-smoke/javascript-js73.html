<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Navigator JavaScript JS73</title></head>
<body>
<h1>Navigator JavaScript JS73</h1>
<section id="series" class="container">
  <li id="a" class="selected active visible"></li>
  <li id="b"></li>
  <li id="c" class="selected visible"></li>
  <li id="d" class="selected active"></li>
  <li id="e" class="active"></li>
  <li id="f" class="selected required"></li>
</section>
<section id="other">
  <li id="g" class="selected active"></li>
  <li id="h" class="selected"></li>
</section>
<section id="checks">
  <input id="check-a" type="checkbox">
  <input id="check-b" type="checkbox">
  <input id="disabled-c" type="checkbox" disabled>
</section>
<section id="radio-group">
  <input id="radio-a" type="radio" name="choice">
  <input id="radio-b" type="radio" name="choice">
</section>
<section id="event-buttons">
  <button id="event-a" class="selected" type="button">A</button>
  <button id="event-b" class="selected" type="button">B</button>
</section>
<pre id="result">JS73:pending</pre>
<script>
var assertions = 0;
var failures = 0;
function verify(condition) {
  assertions++;
  if (!condition) failures++;
}

var series = document.getElementById('series');
var a = document.getElementById('a');
var b = document.getElementById('b');
var c = document.getElementById('c');
var d = document.getElementById('d');
var e = document.getElementById('e');
var f = document.getElementById('f');
var h = document.getElementById('h');
verify(document.querySelector(':nth-child(2 of .selected)') === c);
verify(document.querySelector(':nth-last-child(1 of .selected)') === f);
verify(!b.matches(':nth-child(2 of .selected)') &&
  c.matches(':nth-child(2 of .selected)'));
var firstThree = series.querySelectorAll(':scope > :nth-child(-n+3 of .selected)');
verify(firstThree.length === 3 && firstThree[0] === a &&
  firstThree[1] === c && firstThree[2] === d);
var activeReverse = series.querySelectorAll(':nth-last-child(even of .active)');
verify(activeReverse.length === 1 && activeReverse[0] === d);
verify(series.querySelector(':nth-child(2 of .active)') === d);
var four = document.querySelectorAll(
  '#series > :nth-child(1 of .visible), ' +
  '#series > :nth-child(2 of .selected), ' +
  '#series > :nth-last-child(1 of .active), ' +
  '#series > :nth-last-child(1 of .required)');
verify(four.length === 4);
verify(four[0] === a && four[1] === c && four[2] === e && four[3] === f);
verify(document.querySelector('#other > :nth-child(2 of .selected)') ===
  document.getElementById('h'));
var indexedRows = series.querySelectorAll(
  ':scope > :nth-child(n of .selected)');
verify(indexedRows.length === 4 && indexedRows[0] === a &&
  indexedRows[2] === d && indexedRows[3] === f);
verify(indexedRows[2] === d && indexedRows[0] === a);
verify(indexedRows[4] === undefined);
var otherRoot = document.getElementById('other');
var otherRows = otherRoot.querySelectorAll(
  ':scope > :nth-child(n of .active)');
verify(otherRows.length === 1 && otherRows[0].id === 'g' &&
  indexedRows[0] === a);
h.setAttribute('class', 'active');
verify(otherRows.length === 2 && otherRows[1] === h &&
  indexedRows.length === 4 && indexedRows[0] === a);
h.removeAttribute('class');
verify(otherRows.length === 1 && otherRows[0].id === 'g' &&
  indexedRows[0] === a);
var scoped = series.querySelectorAll(':scope > li:nth-child(odd of .selected)');
verify(scoped.length === 2 && scoped[0] === a && scoped[1] === d);
verify(a.matches(':nth-child(1 of :scope)') &&
  !c.matches(':nth-child(2 of :scope)'));
verify(d.closest(':nth-child(3 of .selected)') === d);
verify(document.querySelectorAll('#series > :nth-child(2 of .selected)').length === 1 &&
  document.querySelectorAll('#series > :nth-child(2 of .selected)').length === 1);
var live = series.querySelectorAll(':scope > :nth-child(2 of .selected)');
verify(live.length === 1 && live[0] === c);
b.setAttribute('class', 'selected');
verify(live.length === 1 && live[0] === b);
b.removeAttribute('class');
verify(live.length === 1 && live[0] === c);
verify(document.querySelector(':nth-child(2 of .selected, .active)') === null);
verify(document.querySelector(':nth-child(2 of .selected > .active)') === null);
verify(a.matches('.selected:nth-child(1)'));

var checkA = document.getElementById('check-a');
var checkB = document.getElementById('check-b');
var checkedRows = document.querySelectorAll(
  'input:nth-child(n of :checked)');
verify(checkedRows.length === 0);
checkA.checked = true;
verify(checkedRows.length === 1 && checkedRows[0] === checkA);
checkB.checked = true;
verify(checkedRows.length === 2 && checkedRows[0] === checkA &&
  checkedRows[1] === checkB);
checkA.checked = false;
verify(checkedRows.length === 1 && checkedRows[0] === checkB);
var focusRows = document.querySelectorAll('input:nth-child(n of :focus)');
checkA.focus();
verify(focusRows.length === 1 && focusRows[0] === checkA);
checkB.focus();
verify(focusRows.length === 1 && focusRows[0] === checkB);
var disabledRows = document.querySelectorAll(
  'input:nth-child(n of :disabled)');
var disabledC = document.getElementById('disabled-c');
verify(disabledRows.length === 1 && disabledRows[0] === disabledC);
var radioA = document.getElementById('radio-a');
var radioB = document.getElementById('radio-b');
var radioRows = document.querySelectorAll(
  '#radio-group > input:nth-child(n of :checked)');
verify(radioRows.length === 0);
radioA.checked = true;
verify(radioRows.length === 1 && radioRows[0] === radioA);
radioB.checked = true;
verify(radioRows.length === 1 && radioRows[0] === radioB &&
  radioA.checked === false);

var eventA = document.getElementById('event-a');
var eventB = document.getElementById('event-b');
var eventResult = false;
var nestedResult = false;
var eventMetadata = false;
eventA.addEventListener('click', function(event) {
  var target = event.target;
  var before = document.querySelectorAll(
    '#event-buttons > :nth-child(n of .selected)');
  var beforeFirst = before[0];
  var beforeSecond = before[1];
  eventB.click();
  var after = document.querySelectorAll(
    '#event-buttons > :nth-child(n of .selected)');
  eventResult = before.length === 2 && beforeFirst === eventA &&
    beforeSecond === eventB && after.length === 2 &&
    after[0] === eventA && after[1] === eventB &&
    before.length === 2 && before[0] === eventA && before[1] === eventB &&
    target === event.target;
  eventMetadata = event.currentTarget === target && event.eventPhase === 2;
  verify(eventResult);
  verify(nestedResult);
  verify(eventMetadata);
  document.getElementById('result').textContent =
    'JS73:event=' + eventResult + ':nested=' + nestedResult +
    ':metadata=' + eventMetadata + ':assertions=' + assertions +
    ':failures=' + failures;
});
eventB.addEventListener('click', function(event) {
  var rows = document.querySelectorAll(
    '#event-buttons > :nth-child(2 of .selected)');
  nestedResult = rows.length === 1 && rows[0] === eventB &&
    event.target === eventB && event.currentTarget === eventB &&
    event.eventPhase === 2;
});
document.getElementById('result').textContent =
  'JS73:initial:assertions=' + assertions + ':failures=' + failures +
  ':malformed=true';
</script>
</body>
</html>
