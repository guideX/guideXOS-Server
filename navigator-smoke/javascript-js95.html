<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Navigator JavaScript JS95</title></head>
<body>
<h1>Navigator JavaScript JS95</h1>
<pre id="result">JS95:pending</pre>
<button id="filter-event-a" type="button">Run JS95 filter event</button>
<button id="filter-event-b" type="button">Nested JS95 filter event</button>
<script>
var assertions = 0;
var failures = 0;
function verify(condition) {
  assertions++;
  if (!condition) failures++;
}

var source = [1, 2, 3, 4, 5, 6];
var calls = 0;
var callbackArgs = true;
var indices = "";
var evens = source.filter(function(value, index, array) {
  calls++;
  indices = indices + index;
  callbackArgs = callbackArgs && array === source;
  return value % 2 === 0;
});
verify(calls === 6 && indices === "012345" && callbackArgs &&
  evens.length === 3 && evens[0] === 2 && evens[1] === 4 && evens[2] === 6);
verify(evens !== source && source[1] === 2 && source[3] === 4);

var empty = [];
var emptyCalls = 0;
var emptyResult = empty.filter(function() { emptyCalls++; return true; });
verify(emptyResult !== empty && emptyResult.length === 0 && emptyCalls === 0);

var context = {keep: 7};
var thisArgOk = false;
var one = [7].filter(function(value, index, array) {
  thisArgOk = this === context && value === 7 && index === 0 && array.length === 1;
  return this.keep === value;
}, context);
verify(thisArgOk && one.length === 1 && one[0] === 7);

var objectValue = {tag: 3};
var arrayValue = [9];
var references = [objectValue, arrayValue];
var referenceResult = references.filter(function() { return true; });
verify(referenceResult !== references && referenceResult[0] === objectValue &&
  referenceResult[1] === arrayValue);

var truthyValues = [0, 2, "", "yes", null, undefined, objectValue, arrayValue];
var truthyCalls = 0;
var truthyResult = truthyValues.filter(function(value) {
  truthyCalls++;
  return value;
});
verify(truthyCalls === 8 && truthyResult.length === 4 && truthyResult[0] === 2 &&
  truthyResult[1] === "yes" && truthyResult[2] === objectValue &&
  truthyResult[3] === arrayValue);

var sparse = [];
sparse.length = 5;
sparse[1] = 10;
sparse[3] = undefined;
var sparseCalls = 0;
var sparseIndices = "";
var sparseResult = sparse.filter(function(value, index) {
  sparseCalls++;
  sparseIndices = sparseIndices + index;
  return true;
});
verify(sparseCalls === 2 && sparseResult.length === 2 && sparseResult[0] === 10 &&
  sparseResult[1] === undefined);
verify(sparseResult.hasOwnProperty("0") && sparseResult.hasOwnProperty("1") &&
  !sparseResult.hasOwnProperty("2") && !sparse.hasOwnProperty("0"));
verify(sparseIndices === "13");

var replaced = [1, 2, 3];
var replaceResult = replaced.filter(function(value, index, array) {
  if (index === 0) array[1] = 9;
  return true;
});
verify(replaceResult.length === 3 && replaceResult[1] === 9);

var filled = [1, , 3];
var fillResult = filled.filter(function(value, index, array) {
  if (index === 0) array[1] = 2;
  return true;
});
verify(fillResult.length === 3 && fillResult[1] === 2);

var shrunk = [4, 5, 6];
var shrinkIndices = "";
var shrinkResult = shrunk.filter(function(value, index, array) {
  shrinkIndices = shrinkIndices + index;
  if (index === 0) {
    array.length = 1;
    array.length = 3;
    array[2] = 6;
  }
  return true;
});
verify(shrinkIndices === "02" && shrinkResult.length === 2 &&
  shrinkResult[0] === 4 && shrinkResult[1] === 6);

var appended = [4, 5];
var appendResult = appended.filter(function(value, index, array) {
  if (index === 0) array[2] = 6;
  return true;
});
verify(appendResult.length === 2 && appended[2] === 6);

var inner = [1, 2, 3];
var nestedCalls = 0;
var nestedResult = [inner].filter(function(values) {
  var selected = values.filter(function(value) { return value > 1; });
  var mapped = selected.map(function(value) { return value * 2; });
  mapped.forEach(function() { nestedCalls++; });
  return nestedCalls === 2 && mapped[0] === 4 && mapped[1] === 6;
});
verify(nestedResult.length === 1 && nestedResult[0] === inner && nestedCalls === 2);

var eventA = document.getElementById("filter-event-a");
var eventB = document.getElementById("filter-event-b");
var nestedEventOk = false;
var outerEventOk = false;
eventB.addEventListener("click", function(event) {
  var values = [1, 2, 3].filter(function(value) { return value > 1; });
  nestedEventOk = event.target === eventB && event.currentTarget === eventB &&
    values.length === 2 && values[0] === 2 && values[1] === 3;
});
eventA.addEventListener("click", function(event) {
  var values = [4, 5, 6].filter(function(value, index) {
    if (index === 0) eventB.click();
    return value > 4;
  });
  outerEventOk = event.target === eventA && event.currentTarget === eventA &&
    values.length === 2 && values[0] === 5 && values[1] === 6 && nestedEventOk;
  document.getElementById("result").textContent =
    "JS95:event:nested=" + nestedEventOk + ":outer=" + outerEventOk;
});

var marker = "JS95:assertions=" + assertions + ":failures=" + failures +
  ":basic=" + (calls === 6 && evens[0] === 2 && evens[2] === 6 && thisArgOk) +
  ":sparse=" + (sparseCalls === 2 && sparseResult.length === 2 &&
    sparseResult.hasOwnProperty("1")) +
  ":mutation=" + (replaceResult[1] === 9 && fillResult[1] === 2 &&
    shrinkIndices === "02" && appendResult.length === 2) +
  ":nested=" + (nestedResult.length === 1 && nestedCalls === 2) +
  ":events=ready";
document.getElementById("result").textContent = marker;
</script>
</body>
</html>
