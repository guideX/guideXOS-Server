<!doctype html>
<html id="root">
<head><title>Navigator JavaScript JS60</title></head>
<body id="body">
<h1>Navigator JavaScript JS60</h1>
<div id="panel" class="panel active" data-role="save">
  <button id="primary" class="action primary" data-role="submit">Save</button>
  <button id="secondary" class="action" data-state="pending">Next</button>
  <div id="primary-div" class="primary"></div>
  <div id="item-ready" class="item" data-state="ready"></div>
  <div id="item-pending" class="item" data-state="pending" data-label=")"></div>
  <div id="item-disabled" class="item disabled" data-state="busy"></div>
  <input id="checked" type="checkbox" checked>
  <input id="unchecked" type="checkbox">
  <input id="disabled-input" type="checkbox" disabled>
  <fieldset id="disabled-group" disabled><input id="inherited-disabled" type="text"></fieldset>
  <input id="field-a" class="field" type="text">
  <input id="field-b" class="field" type="text">
  <label id="label" class="label">Name</label><input id="related-input" type="text">
  <span id="marker" class="marker"></span><span id="sibling-a" class="item"></span>
  <span id="sibling-b" class="item"></span>
  <div id="positions"><span id="first-child" class="position"></span><span id="middle-child" class="position"></span><span id="last-child" class="position"></span></div>
  <div id="types"><span id="type-first"></span><b id="type-b"></b><span id="type-last"></span></div>
  <div id="only-parent"><b id="only-child"></b></div>
  <div id="empty" class="slot" data-empty=""></div><div id="text" class="slot">hello</div>
  <div id="space" class="slot">   </div><div id="comment" class="slot"><!--comment--></div>
  <div id="child" class="slot"><i></i></div>
  <div id="quoted" data-label=")" data-note="two words"></div>
  <input id="event-target" type="button" value="Run">
  <input id="event-nested" type="button" value="Nested">
</div>
<pre id="result">initial</pre>
<script>
var js60IsBasic = document.getElementById("primary").matches(":is(.primary)") &&
  !document.getElementById("secondary").matches(":IS(.primary)") &&
  document.getElementById("root").matches(":Is(html)") &&
  document.getElementById("root").matches(":is(*)") &&
  document.getElementById("primary").matches(":is(#primary)") &&
  document.getElementById("item-pending").matches(":is(.item.disabled)") === false;
var js60IsEquivalence =
  document.getElementById("primary").matches("button") ===
    document.getElementById("primary").matches(":is(button)") &&
  document.getElementById("primary").matches("#primary") ===
    document.getElementById("primary").matches(":is(#primary)") &&
  document.getElementById("primary").matches(".primary") ===
    document.getElementById("primary").matches(":is(.primary)") &&
  document.getElementById("item-pending").matches("[data-state=pending]") ===
    document.getElementById("item-pending").matches(":is([data-state=pending])") &&
  document.getElementById("root").matches(":root") ===
    document.getElementById("root").matches(":is(:root)") &&
  document.getElementById("empty").matches(":empty") ===
    document.getElementById("empty").matches(":is(:empty)");
var js60IsQueries = document.querySelector("button:is(.primary)") ===
  document.getElementById("primary") &&
  document.querySelectorAll(".item:is([data-state=pending])").length === 1 &&
  document.getElementById("panel").querySelector("button:is(.primary)") ===
    document.getElementById("primary") &&
  document.getElementById("secondary").closest(".panel:is(.active)") ===
    document.getElementById("panel");
var js60IsRelations = document.querySelector(
  ".panel:is(.active) > button:is(.primary)") ===
    document.getElementById("primary") &&
  document.querySelector(".marker:is(:empty) ~ .item:is(.item)") ===
    document.getElementById("sibling-a");
var js60IsLists = document.querySelectorAll(
  "button:is(.primary), #primary:is(button), button:is(.primary)").length === 1 &&
  document.querySelectorAll("button:is(.primary), button:is(.action)")[0] ===
    document.getElementById("primary") &&
  document.querySelectorAll("button:is(.primary), button:is(.action)")[1] ===
    document.getElementById("secondary");
var js60IsMalformed = document.querySelector(":is()") === null &&
  document.querySelector(":is( )") === null &&
  document.querySelector(":is(.a,.b)") === null &&
  document.querySelector(":is(.a > .b)") === null &&
  document.querySelector(":is(.a .b)") === null &&
  document.querySelector(":is(.a + .b)") === null &&
  document.querySelector(":is(.a ~ .b)") === null &&
  document.querySelector(":is(:is(.a))") === null &&
  document.querySelector(":is(:not(.a))") === null &&
  document.querySelector(":is(:nth-child(2))") === null &&
  document.querySelector(":is(.a") === null &&
  document.querySelector(":is(.a))") === null &&
  document.querySelector(":is(.a):focus") === null;
var js60IsLiveItems = document.querySelectorAll(".item:is([data-state=ready])");
var js60IsLive = js60IsLiveItems.length === 1;
document.getElementById("item-pending").setAttribute("data-state", "ready");
js60IsLive = js60IsLive && js60IsLiveItems.length === 2 &&
  document.getElementById("item-pending").matches(":is([data-state=ready])");
document.getElementById("item-pending").setAttribute("data-state", "pending");
js60IsLive = js60IsLive && js60IsLiveItems.length === 1;
var js60Not = document.getElementById("item-pending").matches(":not(.disabled)") &&
  !document.getElementById("item-disabled").matches(":not(.disabled)") &&
  document.getElementById("root").matches(":not(div)") &&
  !document.getElementById("panel").matches(":not(#panel)") &&
  document.getElementById("primary-div").matches(":not(button.primary)") &&
  !document.getElementById("primary").matches(":not(button.primary)") &&
  document.getElementById("empty").matches(":NOT( :EMPTY )") === false;
var js60Attributes = document.getElementById("item-pending").matches(
  ":not([data-state=ready])") &&
  !document.getElementById("item-ready").matches(
    ":not([data-state=ready])");
var js60Queries = document.querySelector("button:not(.primary)") ===
  document.getElementById("secondary") &&
  document.querySelectorAll(".item:not([data-state=ready])").length === 4 &&
  document.getElementById("panel").querySelector(".item:not(.disabled)") ===
    document.getElementById("item-ready") &&
  document.getElementById("panel").querySelector(".panel") === null;
var js60Pseudo = document.getElementById("root").matches(":not(:root)") === false &&
  document.getElementById("panel").matches(":not(:root)") &&
  document.getElementById("text").matches(":not(:empty)") &&
  !document.getElementById("empty").matches(":not(:empty)") &&
  document.getElementById("unchecked").matches(":not(:checked)") &&
  !document.getElementById("checked").matches(":not(:checked)") &&
  document.getElementById("secondary").matches(":not(:disabled)") &&
  !document.getElementById("disabled-input").matches(":not(:disabled)") &&
  !document.getElementById("inherited-disabled").matches(
    ":not(:disabled)");
var js60Relations = document.querySelector(
  ".panel:not(.disabled) > button:not(.primary)") ===
    document.getElementById("secondary") &&
  document.querySelector(".marker:not(.disabled) ~ .item:not(.disabled)") ===
    document.getElementById("sibling-a");
var js60List = document.querySelectorAll(
  "button:not(.disabled), #primary:not(.disabled)");
var js60Lists = js60List.length === 2 &&
  js60List[0] === document.getElementById("primary") &&
  js60List[1] === document.getElementById("secondary");
var js60LiveItems = document.querySelectorAll(
  ".item:not([data-state=ready])");
var js60LiveAttributes = js60LiveItems.length === 4;
document.getElementById("item-pending").setAttribute("data-state", "ready");
js60LiveAttributes = js60LiveAttributes && js60LiveItems.length === 3 &&
  document.getElementById("item-pending").matches(
    ":not([data-state=ready])") === false;
document.getElementById("item-pending").setAttribute("data-state", "pending");
js60LiveAttributes = js60LiveAttributes && js60LiveItems.length === 4;
var js60Malformed = document.querySelector(":not(.a,.b)") === null &&
  document.querySelector(":not(.a > .b)") === null &&
  document.querySelector(":not(:not(.a))") === null &&
  document.querySelector(":not(:nth-child(2))") === null &&
  document.querySelector(":not(.a):focus") === null;
var js60Event = false;
var js60Nested = false;
var js60Metadata = false;
document.getElementById("event-target").addEventListener("click", function (event) {
  var target = event.target;
  var current = event.currentTarget;
  var phase = event.eventPhase;
  js60Event = target.matches(":not(:disabled)") &&
    target.matches(":is(input)") &&
    target.closest(".panel:not(.disabled)") === document.getElementById("panel") &&
    target.closest(".panel:is(.active)") === document.getElementById("panel");
  document.getElementById("event-nested").click();
  js60Nested = event.target === target && event.currentTarget === current &&
    event.eventPhase === phase;
  js60Metadata = event.relatedTarget === null &&
    event.defaultPrevented === false && phase === 2;
  js60Snapshot("event");
});
document.getElementById("event-nested").addEventListener("click", function (event) {
  js60Event = js60Event && event.target.matches("input:not(:disabled)");
});
function js60Snapshot(label) {
  document.getElementById("result").textContent = label + ":is=" + js60IsBasic +
  ":equivalence=" + js60IsEquivalence + ":queries=" + js60IsQueries +
  ":relations=" + js60IsRelations + ":lists=" + js60IsLists +
  ":malformed=" + js60IsMalformed + ":live=" + js60IsLive + ":not=" + js60Not +
  ":attrs=" + js60Attributes + ":queries=" + js60Queries +
  ":pseudo=" + js60Pseudo + ":relations=" + js60Relations +
  ":lists=" + js60Lists + ":live=" + js60LiveAttributes +
  ":malformed=" + js60Malformed + ":event=" + js60Event +
  ":nested=" + js60Nested + ":metadata=" + js60Metadata;
}
js60Snapshot("initial");
</script>
</body>
</html>
