holes.find(function() { noMatchCalls=noMatchCalls+1; return false; });

var appended = [4, 5];

var current = [12];

  var inner = [10, 20, 30].find(function(item) {
    nestedInnerCalls=nestedInnerCalls+1;

  });
  return value === 2 && inner === 20;

var nestedEventOk = false;

var innerEventCalls = 0;
var outerEventCalls = 0;

    innerEventCalls=innerEventCalls+1;
